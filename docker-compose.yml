services:
  postgres:
    image: postgres:16-alpine
    container_name: guestlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guestlink
      POSTGRES_PASSWORD: guestlink_secret_password
      POSTGRES_DB: guestlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestlink -d guestlink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
